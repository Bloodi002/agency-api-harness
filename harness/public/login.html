<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Harness Sign-in</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/harness.css">
</head>
<body>
  <header class="masthead"><span class="brand">Rostered<span>AI</span> · Integration QA harness</span></header>
  <main>
    <div class="panel" style="max-width:420px;margin:40px auto">
      <h1>Sign in</h1>
      <p class="lede">Enter the harness password your team lead shared. It is not a RosteredAI account password.</p>
      <p class="notice error" id="failed" hidden>That password is not right.</p>
      <form method="post" action="/login">
        <input type="hidden" name="next" id="next">
        <div class="field">
          <label for="password">Harness password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('next').value = params.get('next') ?? '/';
    document.getElementById('failed').hidden = !params.has('failed');
  </script>
</body>
</html>
